services:
  - type: web
    name: childcare-support-phase-3
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_ENV
        value: production
      - key: APPS_SCRIPT_URL
        value: https://script.google.com/macros/s/AKfycbxbo4ErI10K505h1qMIY8HY7bo-gQU2Gw6c8NSZ3Py6aOTVAsjeK28OPsxilyHjgmTL/exec
      - key: WEBHOOK_SECRET
        value: childcare_phase3_secret_token_2026
      - key: SESSION_SECRET
        generateValue: true
