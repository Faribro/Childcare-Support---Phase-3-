<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 18px 20px 20px;
        color: #0f172a;
        background: #ffffff;
        font-size: 13px;
      }
      .header {
        border-bottom: 2px solid #1e3a8a;
        padding-bottom: 10px;
        margin-bottom: 14px;
      }
      .header h2 {
        margin: 0;
        font-size: 17px;
        font-weight: 700;
        color: #0f172a;
      }
      .header p {
        margin: 4px 0 0;
        font-size: 11.5px;
        color: #475569;
      }
      .field {
        margin-bottom: 14px;
      }
      .field label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: #334155;
        margin-bottom: 4px;
      }
      .field select {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 13px;
        color: #0f172a;
        background: #fff;
      }
      .field select:focus {
        outline: 2px solid #1e3a8a;
        outline-offset: -1px;
        border-color: #1e3a8a;
      }
      .notice {
        font-size: 11px;
        color: #475569;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        padding: 8px 10px;
        margin-bottom: 14px;
        line-height: 1.4;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .btn {
        border: 0;
        border-radius: 6px;
        padding: 9px 14px;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-secondary {
        background: #f1f5f9;
        color: #334155;
      }
      .btn-primary {
        background: #1e3a8a;
        color: #ffffff;
      }
      .btn-primary:disabled {
        background: #94a3b8;
        cursor: not-allowed;
      }
      .status {
        margin-top: 12px;
        padding: 9px 11px;
        border-radius: 6px;
        font-size: 12px;
        display: none;
        line-height: 1.4;
      }
      .status.ok {
        display: block;
        background: #ecfdf5;
        border: 1px solid #a7f3d0;
        color: #065f46;
      }
      .status.err {
        display: block;
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #991b1b;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h2>Send Administration Access Code</h2>
      <p>
        Authorised operator: <strong><?= activeSenderHint || 'Google Workspace Admin' ?></strong>
      </p>
    </div>

    <div class="notice">
      Select an allowlisted Programme Administrator (Name &amp; Email). The confidential Administration portal gate code is dispatched by the portal server directly to that administrator&apos;s inbox and is never written to the Sheet.
    </div>

    <form id="adminAccessForm" onsubmit="return handleSubmit(event);">
      <div class="field">
        <label for="adminSelect">Authorised Administrator</label>
        <select id="adminSelect" required></select>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-secondary" onclick="google.script.host.close();">
          Close
        </button>
        <button type="submit" id="sendBtn" class="btn btn-primary">
          Send Access Code Email
        </button>
      </div>
    </form>

    <div id="statusBox" class="status" role="alert"></div>

    <script>
      var ADMIN_CONTACTS = <?!= adminContactsJson ?> || [];
      var INITIAL_LOAD_ERROR = <?!= initialLoadErrorJson ?> || '';

      function setStatus(ok, text) {
        var box = document.getElementById('statusBox');
        box.className = 'status ' + (ok ? 'ok' : 'err');
        box.textContent = text;
      }

      (function init() {
        var select = document.getElementById('adminSelect');
        var btn = document.getElementById('sendBtn');

        if (!ADMIN_CONTACTS.length) {
          var emptyOpt = document.createElement('option');
          emptyOpt.value = '';
          emptyOpt.textContent = '-- No allowlisted administrators loaded --';
          select.appendChild(emptyOpt);
          select.disabled = true;
          btn.disabled = true;
          if (INITIAL_LOAD_ERROR) {
            setStatus(false, INITIAL_LOAD_ERROR);
          }
          return;
        }

        ADMIN_CONTACTS.forEach(function(item) {
          var opt = document.createElement('option');
          opt.value = item.email;
          opt.dataset.leaderId = item.id || '';
          opt.textContent = item.name + ' (' + item.email + ')';
          select.appendChild(opt);
        });
      })();

      function handleSubmit(e) {
        e.preventDefault();
        var select = document.getElementById('adminSelect');
        var btn = document.getElementById('sendBtn');
        var selectedOption = select.options[select.selectedIndex];
        var targetEmail = select.value;
        var targetId = selectedOption ? (selectedOption.dataset.leaderId || '') : '';

        if (!targetEmail) {
          setStatus(false, 'Please select an authorised Administrator.');
          return false;
        }

        btn.disabled = true;
        btn.textContent = 'Sending...';
        setStatus(true, 'Contacting portal server to send Administration access code...');

        google.script.run
          .withSuccessHandler(function(result) {
            btn.disabled = false;
            btn.textContent = 'Send Access Code Email';
            if (result && result.ok) {
              setStatus(true, result.message || 'Administration access code dispatched.');
            } else {
              setStatus(false, (result && result.message) ? result.message : 'Unable to dispatch access code.');
            }
          })
          .withFailureHandler(function(err) {
            btn.disabled = false;
            btn.textContent = 'Send Access Code Email';
            setStatus(false, (err && err.message) ? err.message : 'Apps Script error.');
          })
          .submitAdminAccessDispatch({
            targetEmail: targetEmail,
            targetId: targetId
          });

        return false;
      }
    </script>
  </body>
</html>
