# Google Cloud Build: Staging Container Build
# Builds standalone Next.js image for Cloud Run with staging-specific build arguments.

steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-staging-image'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_APP_ENV=${_NEXT_PUBLIC_APP_ENV}'
      - '--build-arg'
      - 'NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_STORAGE_PROVIDER=${_NEXT_PUBLIC_STORAGE_PROVIDER}'
      - '--build-arg'
      - 'NEXT_PUBLIC_DATA_ENGINE=${_NEXT_PUBLIC_DATA_ENGINE}'
      - '--build-arg'
      - 'NEXT_PUBLIC_GCS_BUCKET=${_NEXT_PUBLIC_GCS_BUCKET}'
      - '--build-arg'
      - 'GIT_COMMIT_SHA=${_GIT_COMMIT_SHA}'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/csc-containers/csc-staging:${_GIT_COMMIT_SHA}'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/csc-containers/csc-staging:latest'
      - '.'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/csc-containers/csc-staging:${_GIT_COMMIT_SHA}'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/csc-containers/csc-staging:latest'

substitutions:
  _NEXT_PUBLIC_APP_ENV: 'staging'
  _NEXT_PUBLIC_APP_URL: 'https://childcare.allianceindia.org'
  _NEXT_PUBLIC_STORAGE_PROVIDER: 'gcs'
  _NEXT_PUBLIC_DATA_ENGINE: 'firestore'
  _NEXT_PUBLIC_GCS_BUCKET: 'cs-p3-childcare-staging'
  _GIT_COMMIT_SHA: 'latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
